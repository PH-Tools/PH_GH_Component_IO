# -- Project Metadata -------------------------------------------------------------
[project]
name = "PH-GH-Component-IO"
version = "0.0.6"
description = "Rhino/Grasshopper Component I/O Utility Library."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "PH-Tools", email = "phtools@bldgtyp.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
keywords = ["Rhino", "Grasshopper"]
dependencies = []

[project.optional-dependencies]
dev = ["black", "isort", "Grasshopper-stubs", "Rhino-stubs"]

[project.urls]
homepage = "https://www.passivehousetools.com/"
repository = "https://github.com/PH-Tools/PH_GH_Component_IO"

# -- Build ------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# -- Ship only the package (and any future subpackages). Without an include pattern,
# -- top-level folders like context/ and planning/ break flat-layout auto-discovery.
[tool.setuptools.packages.find]
include = ["ph_gh_component_io*"]

# -- Bump My Version ---------------------------------------------------------------
# This repo is distributed via GitHub (not PyPI), so we only tag — no publish step.
[tool.bumpversion]
current_version = "0.0.6"
commit = true
tag = true
tag_name = "v{new_version}"
commit_message = "bump: version {current_version} -> {new_version} [skip ci]"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# -- Code Quality ------------------------------------------------------------------
[tool.black]
line-length = 120
